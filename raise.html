.grid{display:grid;gap:18px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}@media(max-width:1000px){.g3,.g4{grid-template-columns:1fr 1fr}}@media(max-width:700px){.g2,.g3,.g4{grid-template-columns:1fr}}

.board{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.col{background:#EEF2F6;border-radius:14px;padding:12px;min-height:200px}.col h5{display:flex;align-items:center;gap:8px;margin:2px 4px 10px;font-size:12px;color:var(--grey)}.col h5 .cnt{margin-left:auto;font-size:11px;background:#fff;padding:0 7px;border-radius:9px}.col.over{background:#E3ECF7}

.col.red,.col.blue,.col.grey{background:#fff}
.board.plain .tcard{border:1px solid var(--line2);box-shadow:none}.board.plain .tcard.u-red{border-left:3px solid var(--red)}.board.plain .tcard.u-blue{border-left:3px solid var(--blue)}.board.plain .tcard.u-grey{border-left:3px solid var(--line)}
.psec{margin-bottom:22px}.psh{display:flex;align-items:baseline;gap:10px;margin:0 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line2)}.psh b{font-size:12.5px;color:var(--navy)}.psh span{font-size:11.5px;color:var(--grey)}

.rlayout{display:grid;grid-template-columns:320px 1fr;gap:22px;max-width:1120px;margin:30px auto 80px;padding:0 24px}
.rnav{position:sticky;top:24px;align-self:start}.rnk{font-size:11px;font-weight:700;color:var(--blue);letter-spacing:.06em;text-transform:uppercase}.rnav h1{margin:8px 0 8px;font-size:24px;letter-spacing:-.025em;line-height:1.15}.rnav p{color:var(--grey);font-size:13px;line-height:1.55;margin:0 0 18px}
.rsteps{display:flex;flex-direction:column;gap:6px;margin-bottom:18px}.rst{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;cursor:pointer;border:1px solid transparent}.rst.on{background:#fff;border-color:var(--line)}.rst .sb{width:28px;height:28px;border-radius:50%;background:#fff;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:12px;color:var(--grey);flex:none}.rst .sb svg{width:13px;height:13px}.rst.on .sb{background:var(--blue);border-color:var(--blue);color:#fff}.rst.done .sb{background:var(--green);border-color:var(--green);color:#fff}.rst b{display:block;font-size:13px}.rst span{font-size:11.5px;color:var(--grey)}
.rside{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px}.rsk{font-size:11px;font-weight:700;color:var(--grey);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}.rsl{padding:6px 0;border-bottom:1px solid var(--line2);font-size:12.5px}.rsl b{display:block;font-size:11px;color:var(--grey);font-weight:600}.rsl span{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.rsf{margin-top:12px}.rsfl{font-size:11px;font-weight:700;color:var(--grey);margin-bottom:6px}.dial{display:flex;align-items:center;gap:10px}.dial b{font-size:24px;color:var(--navy);letter-spacing:-.02em}.dial span{font-size:12px;color:var(--grey)}
.rhd{margin-bottom:18px}.rhd .k{font-size:11px;font-weight:700;color:var(--blue);letter-spacing:.06em;text-transform:uppercase}.rhd h2{margin:6px 0 4px;font-size:22px;letter-spacing:-.02em}.rhd p{margin:0;color:var(--grey);line-height:1.55}
.exrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:-6px 0 14px}.exchip{font-size:11.5px;padding:5px 10px;border-radius:16px;border:1px dashed #BFD0E2;background:#F7FAFE;color:var(--blue2)}.exchip:hover{background:var(--sel)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
@media(max-width:900px){.rlayout{grid-template-columns:1fr}.rnav{position:static}.rside{display:none}}
@media(max-width:820px){.side .raise{display:none}.rcard{padding:26px 22px;margin:16px}.ob{grid-template-columns:1fr}.ob-r{display:none}.board{grid-template-columns:1fr}}
</style>
