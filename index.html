<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="robots" content="noindex">
<title>Emapta AI Labs Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#00263F;--navy2:#0B3A5E;--blue:#0469F2;--blue2:#0450BE;--aqua:#61D2F3;--ink:#141F2B;--ink2:#354554;--grey:#63758A;--grey2:#93A3B2;--line:#E2E8EF;--line2:#EDF1F6;--bg:#F5F7FA;--hover:#F3F6FA;--sel:#E8F0FD;--green:#178A4F;--greenbg:#E6F5EC;--red:#C13A2C;--redbg:#FCECEA;--ease:cubic-bezier(.22,.8,.3,1)}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:Inter,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:13.5px;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;overflow:hidden;letter-spacing:-.005em;line-height:1.5}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}input,textarea,select{font:inherit;color:inherit}a{color:var(--blue2)}
svg.i{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}@keyframes fill{from{width:0}}@keyframes tick{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes slide{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.shell{display:grid;grid-template-columns:232px 1fr;grid-template-rows:56px 1fr;height:100vh}
.top{grid-column:1/3;display:flex;align-items:center;gap:14px;padding:0 20px;background:linear-gradient(90deg,#00263F,#0B3A5E);color:#fff}
.logo{display:flex;align-items:center;gap:10px;width:212px}.logo img{height:20px}.logo span{font-size:13px;color:#C9D8E5}.logo b{color:#fff}
.search{flex:1;max-width:420px;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);border-radius:10px;padding:7px 12px;color:#B7CEDF}.search input{border:0;background:none;outline:0;flex:1;font-size:13px;color:#fff}.search input::placeholder{color:#9FB8CC}
.sp{flex:1}
.me{display:flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.08);border-radius:10px;padding:5px 9px}.me select{border:0;background:none;outline:0;font-weight:600;font-size:12.5px;color:#fff}.me select option{color:var(--ink)}.top .btn.ghost{color:#fff;background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.16)}
.av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:700;color:#fff;flex:none}
.side{background:#fff;border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.nav{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:10px;color:var(--ink2);font-weight:520;width:100%;text-align:left;transition:.15s}.nav:hover{background:var(--hover)}.nav.on{background:var(--sel);color:var(--blue2);font-weight:650}.nav .cnt{margin-left:auto;font-size:11px;background:var(--line2);color:var(--grey);padding:1px 7px;border-radius:10px;font-weight:600}.nav.on .cnt{background:#D6E4FC;color:var(--blue2)}
.lab{font-size:10.5px;font-weight:700;color:var(--grey2);padding:16px 11px 6px;letter-spacing:.05em;text-transform:uppercase}
.pj{display:flex;align-items:center;gap:9px;padding:7px 11px;border-radius:9px;font-size:12.5px;color:var(--ink2);width:100%;text-align:left}.pj:hover{background:var(--hover)}.pj.on{background:var(--sel);color:var(--blue2);font-weight:600}.pj i{width:8px;height:8px;border-radius:3px;flex:none}
.main{overflow:auto}.page{padding:30px 36px 110px;max-width:1120px;margin:0 auto;animation:rise .35s var(--ease)}
.ph{display:flex;align-items:flex-end;gap:16px;margin-bottom:24px}.ph h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.025em;line-height:1.15}.ph p{margin:6px 0 0;color:var(--grey);max-width:60ch}.ph .act{margin-left:auto;display:flex;gap:8px}
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:10px;font-weight:600;font-size:13px;border:1px solid var(--line);background:#fff;color:var(--ink2);transition:.15s var(--ease);white-space:nowrap}.btn:hover{border-color:#BFD0E2;transform:translateY(-1px)}.btn.p{background:var(--blue);border-color:var(--blue);color:#fff}.btn.n{background:var(--navy);border-color:var(--navy);color:#fff}.btn.s{padding:5px 10px;font-size:12px}.btn.ghost{border-color:transparent;background:transparent}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 1px 2px rgba(10,30,50,.04)}.ch{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line2)}.ch h3{margin:0;font-size:14px;font-weight:650}.ch p{margin:0;font-size:12.5px;color:var(--grey)}.ch .r{margin-left:auto;display:flex;gap:8px}.cb{padding:18px 20px}
.grid{display:grid;gap:18px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}@media(max-width:1000px){.g3,.g4{grid-template-columns:1fr 1fr}}@media(max-width:700px){.g2,.g3,.g4{grid-template-columns:1fr}}
.stagger>*{animation:rise .45s var(--ease) both}.stagger>*:nth-child(2){animation-delay:.06s}.stagger>*:nth-child(3){animation-delay:.12s}.stagger>*:nth-child(4){animation-delay:.18s}.stagger>*:nth-child(5){animation-delay:.24s}.stagger>*:nth-child(6){animation-delay:.3s}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:650;padding:2px 8px;border-radius:12px;white-space:nowrap}.pill.g{background:var(--greenbg);color:var(--green)}.pill.r{background:var(--redbg);color:var(--red)}.pill.b{background:#E7F0FE;color:var(--blue2)}.pill.n{background:var(--line2);color:var(--grey)}.pill.k{background:var(--navy);color:#fff}
.kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px;min-height:100px}.kpi .l{font-size:12px;color:var(--grey);font-weight:600}.kpi .v{font-size:28px;font-weight:700;letter-spacing:-.025em;margin-top:4px;color:var(--navy)}.kpi .d{font-size:11.5px;color:var(--grey2);margin-top:2px}.kpi.dark{background:linear-gradient(140deg,#0B3A5E,#00263F);border-color:transparent}.kpi.dark .l{color:var(--aqua)}.kpi.dark .v{color:#fff}.kpi.dark .d{color:#9FB8CC}
/* tasks */
.trow{display:flex;align-items:center;gap:12px;padding:11px 18px;border-bottom:1px solid var(--line2);cursor:pointer;transition:background .12s}.trow:hover{background:var(--hover)}.trow:last-child{border-bottom:0}.trow.done .tt{color:var(--grey2);text-decoration:line-through}
.tt{flex:1;font-weight:560;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tsub{font-size:11.5px;color:var(--grey);margin-top:1px;font-weight:500}
.chk{width:20px;height:20px;min-width:20px;border-radius:50%;border:1.5px solid #B9C7D4;display:grid;place-items:center;background:#fff;padding:0;transition:.15s}.chk svg{width:12px;height:12px;opacity:0;color:#fff}.chk:hover{border-color:var(--green)}.chk.on{background:var(--green);border-color:var(--green)}.chk.on svg{opacity:1;animation:tick .3s var(--ease)}
.due{font-size:11.5px;font-weight:600;color:var(--grey);white-space:nowrap}.due.late{color:var(--red)}.due.today{color:var(--blue2)}
.prio{width:8px;height:8px;border-radius:50%;flex:none}.prio.high{background:var(--red)}.prio.med{background:var(--blue)}.prio.low{background:var(--grey2)}
.quick{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:6px 8px 6px 16px;margin-bottom:18px;box-shadow:0 1px 2px rgba(10,30,50,.04)}.quick input{flex:1;border:0;outline:0;font-size:14px;padding:8px 0}.quick select{border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:12px;background:#fff}
.section-t{font-size:12px;font-weight:700;color:var(--grey);text-transform:uppercase;letter-spacing:.05em;margin:22px 0 10px}
/* projects */
.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}@media(max-width:1000px){.pgrid{grid-template-columns:1fr 1fr}}
.pcard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px;cursor:pointer;transition:.2s var(--ease);display:flex;flex-direction:column;gap:12px;min-height:168px}.pcard:hover{transform:translateY(-3px);box-shadow:0 20px 40px -26px rgba(0,38,63,.4);border-color:#BFD0E2}
.pc-top{display:flex;align-items:center;gap:8px}.pc-top i{width:10px;height:10px;border-radius:3px}.pc-name{font-weight:700;font-size:15px;color:var(--navy);letter-spacing:-.01em;line-height:1.3}.pc-sub{font-size:12px;color:var(--grey)}
.bar{height:6px;background:var(--line2);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--aqua));border-radius:6px;animation:fill .9s var(--ease)}
.pc-foot{display:flex;align-items:center;gap:8px;margin-top:auto;font-size:12px;color:var(--grey)}.avs{display:flex}.avs .av{width:22px;height:22px;font-size:9px;margin-left:-6px;border:2px solid #fff}.avs .av:first-child{margin-left:0}
.pheader{display:flex;align-items:flex-start;gap:16px;margin-bottom:18px}.pheader h1{margin:4px 0 6px;font-size:24px;letter-spacing:-.02em}.pmeta{display:flex;gap:14px;align-items:center;font-size:12.5px;color:var(--grey);flex-wrap:wrap}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:4px 0 18px}.tab{padding:9px 13px;font-weight:600;font-size:12.5px;color:var(--grey);border-bottom:2px solid transparent;margin-bottom:-1px}.tab.on{color:var(--blue2);border-bottom-color:var(--blue)}
.links{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.lnk{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:12.5px;color:var(--blue2);text-decoration:none}.lnk:hover{border-color:#BFD0E2;background:#F7FAFE}.lnk.add{color:var(--grey);border-style:dashed}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.col{background:#EEF2F6;border-radius:14px;padding:12px;min-height:200px}.col h5{display:flex;align-items:center;gap:8px;margin:2px 4px 10px;font-size:12px;color:var(--grey)}.col h5 .cnt{margin-left:auto;font-size:11px;background:#fff;padding:0 7px;border-radius:9px}.col.over{background:#E3ECF7}
.tcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 12px 10px;margin-bottom:10px;cursor:grab;display:flex;flex-direction:column;gap:8px;transition:.15s}.tcard:hover{border-color:#BFD0E2;box-shadow:0 10px 24px -18px rgba(0,38,63,.4)}.tcard .t{font-weight:600;line-height:1.35}.tcard .f{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--grey)}
.empty{padding:28px;text-align:center;color:var(--grey)}.empty b{display:block;color:var(--ink);margin-bottom:4px}
/* drawer */
.drawer-bg{position:fixed;inset:0;background:rgba(6,20,36,.3);z-index:60}.drawer{position:fixed;top:0;right:0;bottom:0;width:540px;max-width:100vw;background:#fff;z-index:61;display:flex;flex-direction:column;box-shadow:-30px 0 60px -30px rgba(0,0,0,.4);animation:slide .3s var(--ease)}
.drawer .dh{display:flex;align-items:flex-start;gap:10px;padding:18px 22px 14px;border-bottom:1px solid var(--line)}.drawer .dh h2{margin:0;font-size:16px;font-weight:680;flex:1}.drawer .db{padding:18px 22px;overflow:auto;flex:1}.drawer .df{padding:12px 22px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;background:#FAFBFD}
.x{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--grey)}.x:hover{background:var(--hover)}
.fld{margin-bottom:14px}.fld label{display:block;font-size:12px;font-weight:650;color:var(--ink2);margin-bottom:6px}.in{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:13.5px;background:#fff;outline:0;transition:.14s}.in:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(4,105,242,.12)}textarea.in{min-height:80px;resize:vertical;line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{font-size:12px;font-weight:600;padding:6px 11px;border-radius:20px;border:1px solid var(--line);background:#fff;color:var(--ink2)}.chip.on{color:#fff;border-color:transparent;background:var(--navy)}
.title-in{width:100%;border:0;outline:0;font-size:18px;font-weight:700;letter-spacing:-.02em;padding:4px 0;color:var(--navy)}
.sub{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid var(--line2)}.sub input{border:0;outline:0;flex:1;font-size:13px}
.cmt{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line2)}.cmt .b{flex:1;font-size:13px}.cmt .m{font-size:11px;color:var(--grey);margin-bottom:2px}
/* overview */
.hbar{display:flex;align-items:center;gap:12px;padding:8px 0;font-size:13px}.hbar .hl{width:240px;font-weight:600;cursor:pointer}.hbar .ht{flex:1;height:8px;background:var(--line2);border-radius:6px;overflow:hidden}.hbar .ht i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--aqua));animation:fill 1s var(--ease)}.hbar .hv{width:90px;text-align:right;color:var(--grey);font-weight:600;font-size:12px}
.act-row{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line2);font-size:12.5px}.act-row:last-child{border-bottom:0}.act-row .when{color:var(--grey2);width:64px;flex:none}
/* assistant */
.chat{display:grid;grid-template-rows:1fr auto;height:calc(100vh - 56px - 60px);max-width:860px;margin:0 auto}.msgs{overflow:auto;padding:20px 4px;display:flex;flex-direction:column;gap:12px}.msg{max-width:78%;padding:12px 15px;border-radius:16px;line-height:1.55;animation:rise .3s var(--ease)}.msg.me{align-self:flex-end;background:var(--navy);color:#fff;border-bottom-right-radius:4px}.msg.ai{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}.msg .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.ask{display:flex;gap:8px;align-items:flex-end;background:#fff;border:1px solid var(--line);border-radius:16px;padding:8px 8px 8px 14px;box-shadow:0 6px 24px -16px rgba(0,38,63,.3)}.ask textarea{flex:1;border:0;outline:0;resize:none;font-size:13.5px;max-height:120px;line-height:1.5;padding:6px 0}
.sugg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.sugg button{font-size:12px;font-weight:600;padding:6px 11px;border-radius:20px;border:1px solid var(--line);background:#fff;color:var(--ink2)}.sugg button:hover{border-color:#BFD0E2}
/* onboarding */
.ob-bg{position:fixed;inset:0;background:rgba(0,20,38,.6);backdrop-filter:blur(6px);z-index:90;display:grid;place-items:center;padding:20px}.ob{width:900px;max-width:100%;background:#fff;border-radius:22px;overflow:hidden;display:grid;grid-template-columns:1.1fr 1fr;min-height:460px;animation:pop .45s var(--ease)}
.ob-l{padding:40px 42px;display:flex;flex-direction:column}.ob-l .k{font-size:11px;font-weight:700;color:var(--blue);letter-spacing:.06em;text-transform:uppercase}.ob-l h2{margin:12px 0 10px;font-size:28px;letter-spacing:-.025em;line-height:1.15;animation:rise .45s var(--ease)}.ob-l p{color:var(--ink2);line-height:1.65;flex:1;font-size:14px;animation:rise .5s var(--ease)}
.ob-dots{display:flex;gap:6px;margin:14px 0}.ob-dots i{width:24px;height:4px;border-radius:4px;background:var(--line);transition:.3s}.ob-dots i.on{background:var(--blue)}.ob-foot{display:flex;justify-content:space-between;align-items:center}.ob-foot .skip{color:var(--grey);font-weight:600}
.ob-r{background:linear-gradient(150deg,#0B3A5E,#00263F);position:relative;overflow:hidden;display:grid;place-items:center}.ob-r::before{content:"";position:absolute;width:420px;height:420px;border-radius:50%;border:1px solid rgba(97,210,243,.2);right:-120px;bottom:-140px}.ob-r::after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(97,210,243,.35),transparent 70%);left:-60px;top:-60px}
.mock{width:300px;display:flex;flex-direction:column;gap:10px;position:relative;z-index:1;animation:float 5s ease-in-out infinite}.mock .mc{background:#fff;border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 20px 40px -20px rgba(0,0,0,.5);animation:rise .6s var(--ease) both}.mock .mc:nth-child(2){animation-delay:.15s}.mock .mc:nth-child(3){animation-delay:.3s}.mock .mc .l{flex:1}.mock .mc .l b{display:block;font-size:12.5px;color:var(--navy)}.mock .mc .l span{font-size:11px;color:var(--grey)}.mock .mc .bar{width:100%;margin-top:6px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;font-size:12.5px;font-weight:600;opacity:0;transition:.25s;z-index:100}.toast.on{opacity:1;transform:translateX(-50%)}
.hint{font-size:12px;color:var(--grey2)}

.srail{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;margin:6px 0 18px}.sn{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px;border-radius:12px;cursor:pointer;transition:.15s}.sn:hover{background:#fff}.sn .sb{width:30px;height:30px;border-radius:50%;background:#fff;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:12px;color:var(--grey)}.sn .sb svg{width:14px;height:14px}.sn.done .sb{background:var(--green);border-color:var(--green);color:#fff}.sn.cur .sb{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 0 0 4px rgba(4,105,242,.15)}.sn .st{font-size:11px;font-weight:600;color:var(--grey);text-align:center;line-height:1.25}.sn.cur .st{color:var(--blue2)}
.stepcard{background:linear-gradient(140deg,#0B3A5E,#00263F);color:#fff;border-radius:16px;padding:22px 24px;margin-bottom:18px;animation:pop .35s var(--ease)}.stepcard .k{font-size:11px;font-weight:700;color:var(--aqua);letter-spacing:.04em;text-transform:uppercase}.stepcard h2{margin:6px 0 6px;font-size:20px;letter-spacing:-.02em}.stepcard p{margin:0 0 14px;color:#B7CEDF;font-size:13px;max-width:70ch}.stepcard .btn.p{background:#fff;color:var(--navy);border-color:#fff}
.srow{display:flex;align-items:center;gap:12px;padding:11px 18px;border-bottom:1px solid var(--line2);cursor:pointer}.srow:hover{background:var(--hover)}.srow:last-child{border-bottom:0}.srow .sb{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--grey);flex:none}.srow .sb svg{width:12px;height:12px}.srow.done .sb{background:var(--green);border-color:var(--green);color:#fff}.srow .t{font-weight:600}.srow .s{font-size:12px;color:var(--grey);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stepq{background:#F4F8FD;border:1px solid #D9E7F6;border-radius:12px;padding:12px 14px;margin-bottom:16px}.stepq b{display:block;color:var(--navy);margin-bottom:2px}.stepq span{font-size:12.5px;color:#33526E}
.guide{background:#F4F8FD;border:1px solid #D9E7F6;border-radius:10px;padding:10px 12px;font-size:12.5px;color:#33526E;margin-bottom:14px}
.lens{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line2)}.lens .ll{font-size:12.5px;font-weight:600}.lens .chip{padding:4px 9px;font-size:11.5px}
.row{border:1px solid var(--line2);border-radius:12px;padding:12px;margin-bottom:10px;background:#FBFCFE}.add{width:100%;display:flex;justify-content:center;align-items:center;gap:6px;padding:9px;border:1px dashed #BFD0E2;border-radius:10px;color:var(--blue);font-weight:600;background:#F7FAFE}
.dsum{background:#FBFCFE;border:1px solid var(--line2);border-radius:12px;padding:12px 14px;margin-bottom:14px}.dsum .k{font-size:11px;font-weight:700;color:var(--grey);text-transform:uppercase;letter-spacing:.04em}.dsum p{margin:6px 0 10px;font-size:13px}.dsum .facts{display:grid;grid-template-columns:1fr 1fr;gap:8px}.dsum .facts b{display:block;font-size:11px;color:var(--grey)}.dsum .facts span{font-size:12.5px}

.bell{position:relative;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:#fff;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16)}.bell .bdg{position:absolute;top:-5px;right:-5px;background:var(--red);color:#fff;font-size:10px;font-weight:700;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}.dot.on{background:var(--blue)}
.apr{display:flex;align-items:center;gap:12px;background:#F4F8FD;border:1px solid #D9E7F6;border-radius:12px;padding:12px 14px;margin:4px 0 16px}.apr>div:first-child{flex:1}.apr b{display:block;font-size:12.5px;color:var(--navy)}.apr span{font-size:12px;color:var(--grey)}.apr.pending{background:#E7F0FE;border-color:#C3D7F7}.apr.ok{background:var(--greenbg);border-color:#BFE6CE}.apr.changes{background:var(--redbg);border-color:#F2C4BE}
.lgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}@media(max-width:1000px){.lgrid{grid-template-columns:1fr 1fr}}
.lcard{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;transition:.2s var(--ease)}.lcard:hover{transform:translateY(-3px);box-shadow:0 22px 44px -26px rgba(0,38,63,.45);border-color:#BFD0E2}
.thumb{height:128px;background-size:cover;background-position:center;display:flex;flex-direction:column;justify-content:space-between;padding:12px 14px;color:#fff;position:relative;overflow:hidden}.thumb::after{content:"";position:absolute;right:-40px;bottom:-60px;width:160px;height:160px;border-radius:50%;border:1px solid rgba(255,255,255,.25)}.thumb .tk{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:rgba(255,255,255,.85)}.thumb b{font-size:30px;letter-spacing:-.02em;opacity:.9}
.lb{padding:14px 16px}.lt{font-weight:700;font-size:14px;color:var(--navy)}.ld{font-size:12px;color:var(--grey);margin:4px 0 10px;min-height:34px}.lf{display:flex;align-items:center;gap:8px}.lf .sp{flex:1}
.wave{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line2);border-radius:12px;padding:10px;margin-bottom:8px;background:#FBFCFE}.wave .wn{width:24px;height:24px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700;flex:none;margin-top:6px}
.pguide{display:flex;gap:14px;align-items:flex-start;background:#fff;border:1px dashed #BFD0E2;border-radius:14px;padding:14px 16px;margin-top:26px;animation:rise .4s var(--ease)}.pguide .gi{width:30px;height:30px;border-radius:9px;background:var(--sel);color:var(--blue2);display:grid;place-items:center;flex:none}.pguide b{display:block;font-size:12.5px;margin-bottom:4px}.pguide ul{margin:0;padding-left:16px;font-size:12.5px;color:var(--ink2)}.pguide li{margin-bottom:2px}
table.tl{width:100%;border-collapse:collapse;font-size:13px}.tl th{text-align:left;font-size:11px;color:var(--grey);font-weight:650;padding:9px 16px;border-bottom:1px solid var(--line);background:#FAFBFD}.tl td{padding:10px 16px;border-bottom:1px solid var(--line2);vertical-align:middle}.tl tr:last-child td{border-bottom:0}.tl tr:hover td{background:var(--hover)}

.rwrap{min-height:100vh;background:var(--bg);overflow:auto;height:100vh}.rtop{display:flex;align-items:center;gap:12px;padding:16px 40px;background:linear-gradient(90deg,#00263F,#0B3A5E);color:#fff}.rtop img{height:20px}.rtop span{font-size:13px;color:#C9D8E5}
.rcard{max-width:820px;margin:34px auto 80px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:40px 44px;animation:rise .4s var(--ease)}.rintro h1{margin:0 0 10px;font-size:28px;letter-spacing:-.025em}.rintro p{color:var(--ink2);line-height:1.6;margin:0 0 10px;max-width:70ch}
.rsec{margin-top:30px;padding-top:26px;border-top:1px solid var(--line2)}.rsec .rh{display:flex;gap:14px;align-items:flex-start;margin-bottom:16px}.rsec .rn{width:30px;height:30px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}.rsec h3{margin:2px 0 4px;font-size:16px}.rsec p{margin:0;color:var(--grey);font-size:13px;max-width:70ch}
.rfoot{display:flex;justify-content:space-between;align-items:center;margin-top:30px;padding-top:20px;border-top:1px solid var(--line2)}
.rcard.done{text-align:center}.rcard.done .big{width:72px;height:72px;border-radius:50%;background:var(--greenbg);color:var(--green);display:grid;place-items:center;margin:0 auto 16px;font-size:30px}.rcard.done h2{margin:0 0 8px;font-size:24px}.rcard.done p{color:var(--ink2);max-width:60ch;margin:0 auto 20px;line-height:1.6}

.legend{display:flex;flex-direction:column;gap:6px;font-size:12px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.bars{display:flex;flex-direction:column;gap:8px}.brow{display:flex;align-items:center;gap:10px;font-size:12px}.bl{width:120px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bt{flex:1;height:9px;background:var(--line2);border-radius:6px;position:relative;overflow:hidden}.bt i{position:absolute;left:0;top:0;height:100%;border-radius:6px;animation:fill .9s var(--ease)}.bt i.b2{background:var(--red)}.bv{width:40px;text-align:right;color:var(--grey);font-weight:600}
.chart svg{max-width:100%;display:block}.ins .irow{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line2);font-size:13px}.ins .irow:last-child{border-bottom:0}.ins .pill{flex:none;margin-top:1px}

.insight{background:linear-gradient(140deg,#0B3A5E,#00263F);color:#fff;border-radius:16px;padding:20px 24px}.insight .ik{font-size:11px;font-weight:700;color:var(--aqua);letter-spacing:.05em;text-transform:uppercase;margin-bottom:8px}.insight .il{display:flex;gap:10px;margin:6px 0;font-size:13.5px;line-height:1.5}.insight .ib{width:7px;height:7px;border-radius:50%;background:var(--aqua);margin-top:7px;flex:none}
.lg{display:flex;align-items:center;gap:8px;font-size:12.5px;margin:4px 0}.lg i{width:10px;height:10px;border-radius:3px;display:inline-block}
@media(max-width:820px){.rcard{padding:26px 22px;margin:16px}.shell{grid-template-columns:1fr}.side{display:none}.ob{grid-template-columns:1fr}.ob-r{display:none}.board{grid-template-columns:1fr}}
</style>
</head>
